<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThoughtSpace</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</head>

<body>

    <header class="navbar">
        <div class="logo">ThoughtSpace</div>

        <button id="writeBtn" class="nav-button">
            Share something
        </button>
    </header>


    <main>

        <!-- HERO -->

        <section class="hero">

            <p class="eyebrow">A place for unfiltered thoughts</p>

            <h1>
                Say what you
                <span>can't say out loud.</span>
            </h1>

            <p class="hero-description">
                Share a thought, idea or confession anonymously.
                No profile. No pressure.
            </p>

            <button id="heroWriteBtn" class="primary-button">
                Share anonymously
            </button>

        </section>


        <!-- CREATE POST -->

        <section id="createSection" class="create-section hidden">

            <div class="create-card">

                <div class="card-header">
                    <h2>What's on your mind?</h2>

                    <button id="closeBtn" class="close-button">
                        ×
                    </button>
                </div>

                <textarea
                    id="postContent"
                    maxlength="1000"
                    placeholder="Write anything..."></textarea>

                <div class="form-bottom">

                    <div class="categories">

                        <button
                            class="category active"
                            data-category="thought">
                            Thought
                        </button>

                        <button
                            class="category"
                            data-category="idea">
                            Idea
                        </button>

                        <button
                            class="category"
                            data-category="confession">
                            Confession
                        </button>

                    </div>

                    <span id="characterCount">
                        0 / 1000
                    </span>

                </div>

                <button id="submitBtn" class="primary-button full">
                    Post anonymously
                </button>

                <p id="formMessage"></p>

            </div>

        </section>


        <!-- FEED -->

        <section class="feed-section">

            <div class="feed-header">

                <div>
                    <p class="eyebrow">Community</p>
                    <h2>Recent thoughts</h2>
                </div>

                <div class="filters">

                    <button
                        class="filter active"
                        data-filter="all">
                        All
                    </button>

                    <button
                        class="filter"
                        data-filter="thought">
                        Thoughts
                    </button>

                    <button
                        class="filter"
                        data-filter="idea">
                        Ideas
                    </button>

                    <button
                        class="filter"
                        data-filter="confession">
                        Confessions
                    </button>

                </div>

            </div>


            <div id="postsContainer" class="posts-container">

                <div class="loading">
                    Loading thoughts...
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>ThoughtSpace — say it, let it out.</p>
    </footer>


    <script src="app.js"></script>

</body>
</html>
